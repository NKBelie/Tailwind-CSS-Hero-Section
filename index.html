<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-white font-sans text-[#171b31]">
    <main class="min-h-screen overflow-hidden bg-white">
        <section class="mx-auto flex min-h-screen w-full max-w-[1226px] items-center px-6 py-10 sm:px-8 lg:px-12 xl:px-0">
            <div class="grid w-full items-center gap-12 lg:grid-cols-2 xl:h-[546px] xl:grid-cols-[562px_538px] xl:gap-[126px]">
                <div class="order-1 mx-auto w-full max-w-[562px] text-center lg:order-1 lg:mx-0 lg:text-left xl:self-start xl:pt-[88px]">
                    <p class="text-base font-semibold leading-7 tracking-normal text-[#171b31] sm:text-lg xl:text-[22px]">
                        Ready to Use Tailwind CSS Web Template.
                    </p>

                    <h1 class="mt-[21px] text-[39px] font-bold leading-[1.18] tracking-normal text-[#171b31] sm:text-5xl lg:text-[51px] xl:text-[50px]">
                        <span class="block">Tailwind Template for</span>
                        <span class="block"><span class="text-[#a7a6ff]">App &amp; Software</span> Site.</span>
                    </h1>

                    <p class="mx-auto mt-[25px] max-w-[526px] text-base leading-7 text-[#788392] sm:text-lg lg:mx-0 xl:text-[17px] xl:leading-[27px]">
                        All in one Tailwind CSS site template for - App and Software sites Comes with all essential components.
                    </p>

                    <div class="mt-10 flex flex-col items-center gap-6 sm:flex-row sm:justify-center lg:justify-start xl:mt-[58px] xl:gap-[24px]">
                        <a href="#" class="inline-flex h-[60px] w-[236px] items-center rounded-[7px] bg-[#171b31] pl-[18px] pr-[22px] text-[17px] font-normal leading-none text-white">
                            <span class="border-r border-white/25 pr-[20px]">Download Now </span>
                            <img src="Apple_Inc.-White-Logo.wine.svg" alt="Apple" class="ml-[19px] h-[35px] w-[35px] object-contain">
                        </a>

                        <a href="#" class="group inline-flex items-center gap-[22px] text-[#171b31]">
                            <img src="play.svg" alt="" class="ml-[19px] h-[35px] w-[35px] object-contain">
                            <span class="text-left">
                                <span class="block text-[15px] font-semibold leading-[20px]">Watch Demo</span>
                                <span class="block text-[17px] font-bold leading-[22px]">See how it works</span>
                            </span>
                        </a>
                    </div>
                </div>

                <div class="order-2 flex justify-center lg:order-2 lg:justify-end xl:self-start">
                    <div class="relative aspect-[538/546] w-full max-w-[360px] sm:max-w-[450px] lg:max-w-[538px]">
                        <div class="absolute left-[8.55%] top-0 aspect-square w-[91.45%] rounded-full bg-[#a9baff]"></div>

                        <div class="absolute left-[84.01%] top-[4.21%] h-[10.62%] w-[13.01%]">
                            <span class="absolute left-[24.29%] top-1/2 aspect-square w-[11.43%] -translate-y-1/2 rotate-45 bg-[#6474ef]"></span>
                            <span class="absolute left-[32.86%] top-0 aspect-square w-[40%] rotate-45 bg-[#6474ef]"></span>
                            <span class="absolute left-[84.29%] top-1/2 aspect-square w-[24.29%] -translate-y-1/2 rotate-45 bg-[#17cfbd]"></span>
                        </div>

                        <svg class="absolute left-[8.55%] top-[76.19%] h-[9.52%] w-[13.38%] text-[#ff5c82]" viewBox="0 0 84 56" fill="none" aria-hidden="true">
                            <path d="M2 6c7 0 7 6 14 6s7-6 14-6 7 6 14 6 7-6 14-6 7 6 14 6 7-6 14-6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                            <path d="M2 18c7 0 7 6 14 6s7-6 14-6 7 6 14 6 7-6 14-6 7 6 14 6 7-6 14-6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                            <path d="M2 30c7 0 7 6 14 6s7-6 14-6 7 6 14 6 7-6 14-6 7 6 14 6 7-6 14-6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                            <path d="M2 42c7 0 7 6 14 6s7-6 14-6 7 6 14 6 7-6 14-6 7 6 14 6 7-6 14-6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        </svg>

                        <img src="hero-light.png" alt="Mobile app preview" class="absolute left-[21.56%] top-[6.23%] z-10 w-[67.1%] object-contain">
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
